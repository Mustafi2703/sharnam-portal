# Nginx reverse proxy for Sharnam Portal on Hostinger VPS
# Install: sudo cp deploy/nginx-sharnam.conf /etc/nginx/sites-available/sharnam-portal
#          sudo ln -sf /etc/nginx/sites-available/sharnam-portal /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d portal.yourdomain.com

server {
    listen 80;
    server_name portal.yourdomain.com;

    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
